<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASTRONAUT · Signal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0a0f; --panel:#13131b; --line:#23232e;
  --txt:#f2f2f7; --dim:#8b8b9b;
  --red:#e01030; --green:#19c44a; --green2:#0f8f35; --blue:#2f7df6; --gold:#ffc83d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--txt)}
.app{min-height:100%;max-width:440px;margin:0 auto;padding:12px 12px 16px;
  display:flex;flex-direction:column;gap:10px}

.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-style:italic;letter-spacing:.5px;font-size:20px}
.badge{font-size:10px;font-weight:800;letter-spacing:1px;color:#000;background:var(--gold);
  padding:3px 7px;border-radius:5px;margin-left:6px;vertical-align:3px;font-style:normal}
.acc{font-size:11px;font-weight:800;color:var(--green);background:rgba(25,196,74,.12);
  border:1px solid rgba(25,196,74,.3);padding:5px 9px;border-radius:8px}

.hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px;
  background:#16161f;border:1px solid var(--line)}
.chip.lo{color:var(--blue)} .chip.mid{color:var(--green)} .chip.hi{color:var(--gold)}

.screen{position:relative;flex:1;min-height:300px;border-radius:16px;overflow:hidden;
  background:radial-gradient(130% 95% at 8% 100%,#1e1e29 0%,#0b0b11 72%);border:1px solid var(--line)}
.screen svg{position:absolute;inset:0;width:100%;height:100%}
.stars{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(1.4px 1.4px at 18% 22%,#fff,transparent),
                   radial-gradient(1.2px 1.2px at 72% 14%,#fff,transparent),
                   radial-gradient(1.6px 1.6px at 38% 58%,#fff,transparent),
                   radial-gradient(1.2px 1.2px at 85% 46%,#fff,transparent),
                   radial-gradient(1.3px 1.3px at 58% 78%,#fff,transparent),
                   radial-gradient(1.1px 1.1px at 28% 86%,#fff,transparent)}
.rocket{position:absolute;font-size:30px;transform:translate(-50%,-50%) rotate(-28deg);
  filter:drop-shadow(0 0 12px rgba(224,16,48,.65))}
.val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;
  font-size:52px;font-weight:900;letter-spacing:-1.5px;text-shadow:0 4px 34px rgba(0,0,0,.7)}
.val small{font-size:28px;font-weight:800;opacity:.8;align-self:center;padding-top:12px}
.val.gone{color:var(--red)}
.state{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;
  font-weight:800;letter-spacing:1.6px;color:var(--dim)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:900}
.stat i{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:2px}

.cash{background:linear-gradient(135deg,#ff9f1c,#f97316);color:#1b1000;border-radius:13px;
  padding:16px;text-align:center;font-weight:900;font-size:18px;display:none}
.cash.show{display:block;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}

.btn{width:100%;border:0;border-radius:13px;padding:18px;font-size:16px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green2));cursor:pointer;letter-spacing:.6px;
  box-shadow:0 10px 26px rgba(15,143,53,.4);position:relative;overflow:hidden;transition:.2s}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:#16161f;color:var(--dim);box-shadow:none;cursor:default}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--green);width:0}
.hint{text-align:center;color:#5c5c70;font-size:11px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">Astronaut<span class="badge">SIGNAL</span></div>
    <div class="acc" id="acc">87%</div>
  </div>

  <div class="hist" id="hist"></div>

  <div class="screen">
    <div class="stars"></div>
    <svg viewBox="0 0 300 160" preserveAspectRatio="none">
      <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e01030" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#e01030" stop-opacity="0"/></linearGradient></defs>
      <path id="area" fill="url(#fill)" d=""></path>
      <path id="line" fill="none" stroke="#e01030" stroke-width="2.5" stroke-linecap="round" d=""></path>
    </svg>
    <div class="rocket" id="rocket" style="left:6%;top:92%">🚀</div>
    <div class="val" id="val">1.00<small>x</small></div>
    <div class="state" id="state">ГОТОВ К ЗАПУСКУ</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="sAvg">—</b><i id="lAvg">СРЕДНИЙ</i></div>
    <div class="stat"><b id="sMax">—</b><i id="lMax">МАКС ЗА 10</i></div>
    <div class="stat"><b id="sCnt">0</b><i id="lCnt">СИГНАЛОВ</i></div>
  </div>

  <div class="cash" id="cash"></div>

  <button class="btn" id="go">
    <span id="goTxt">ПОЛУЧИТЬ СИГНАЛ</span>
    <div class="prog" id="prog"></div>
  </button>
  <div class="hint" id="hint">Забирайте ставку на указанном коэффициенте</div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
try{ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0a0a0f'); }catch(e){}
const hap = t => { try{ tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} };

const T = {
  ru:{btn:'ПОЛУЧИТЬ СИГНАЛ',wait:'СЛЕДУЮЩИЙ ЧЕРЕЗ',sec:'с',ready:'ГОТОВ К ЗАПУСКУ',
      fly:'РАСЧЁТ РАУНДА',gone:'УЛЕТЕЛА',cash:'ЗАБИРАТЬ НА',
      avg:'СРЕДНИЙ',max:'МАКС ЗА 10',cnt:'СИГНАЛОВ',
      hint:'Забирайте ставку на указанном коэффициенте'},
  en:{btn:'GET SIGNAL',wait:'NEXT IN',sec:'s',ready:'READY TO LAUNCH',
      fly:'CALCULATING ROUND',gone:'FLEW AWAY',cash:'CASH OUT AT',
      avg:'AVERAGE',max:'MAX OF 10',cnt:'SIGNALS',
      hint:'Cash out at the multiplier shown'}
};
const q = new URLSearchParams(location.search);
let lang = (q.get('lang') || (tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code) || 'ru').slice(0,2);
if(!T[lang]) lang='ru';

const $ = id => document.getElementById(id);
let busy = false, timerId = null, history = [], signals = 0;

const chipClass = v => v < 2 ? 'lo' : (v < 10 ? 'mid' : 'hi');

function drawHistory(){
  $('hist').innerHTML = '';
  history.slice(0,12).forEach(v=>{
    const d = document.createElement('div');
    d.className = 'chip ' + chipClass(v);
    d.textContent = v.toFixed(2) + 'x';
    $('hist').appendChild(d);
  });
  const last = history.slice(0,10);
  if(last.length){
    $('sAvg').textContent = (last.reduce((a,b)=>a+b,0)/last.length).toFixed(2) + 'x';
    $('sMax').textContent = Math.max(...last).toFixed(2) + 'x';
  }
}
function seedHistory(){
  for(let i=0;i<12;i++){
    const r = Math.random();
    history.push(r < .55 ? 1 + Math.random()*1.5 : (r < .9 ? 2.5 + Math.random()*6 : 10 + Math.random()*40));
  }
  drawHistory();
}

const curve = p => [10 + 280*p, 150 - 138*Math.pow(p,1.7)];
function drawCurve(p){
  let d = 'M10,150';
  for(let i=0;i<=40;i++){ const [x,y]=curve(p*i/40); d += ` L${x.toFixed(1)},${y.toFixed(1)}`; }
  $('line').setAttribute('d', d);
  $('area').setAttribute('d', d + ` L${(10+280*p).toFixed(1)},150 Z`);
  const [cx,cy] = curve(p);
  $('rocket').style.left = (cx/300*100) + '%';
  $('rocket').style.top  = (cy/160*100) + '%';
}

function target(){
  const r = Math.random();
  if (r < .62) return 1.20 + Math.random()*1.3;
  if (r < .92) return 2.50 + Math.random()*2.5;
  return 5 + Math.random()*5;
}

function run(){
  busy = true; $('go').disabled = true;
  $('cash').classList.remove('show');
  $('val').classList.remove('gone');
  $('state').textContent = T[lang].fly;
  $('acc').textContent = (84 + Math.floor(Math.random()*12)) + '%';

  const goal = target(), dur = 2600 + Math.random()*900, t0 = performance.now();
  (function frame(now){
    const p = Math.min(1,(now - t0)/dur);
    const v = 1 + (goal - 1) * (1 - Math.pow(1-p, 2.2));
    $('val').innerHTML = v.toFixed(2) + '<small>x</small>';
    drawCurve(p);
    if(p < 1) requestAnimationFrame(frame); else finish(goal);
  })(t0);
}

function finish(goal){
  $('val').classList.add('gone');
  $('state').textContent = T[lang].gone;
  $('cash').textContent = `${T[lang].cash} ${goal.toFixed(2)}x`;
  $('cash').classList.add('show');
  history.unshift(goal); drawHistory();
  signals++; $('sCnt').textContent = signals;
  hap('medium');
  cooldown(10);
}

function cooldown(sec){
  let left = sec;
  const txt = $('goTxt'), pr = $('prog');
  const tick = ()=>{
    txt.textContent = `${T[lang].wait} ${left}${T[lang].sec}`;
    pr.style.width = (100 - left/sec*100) + '%';
    if(left-- <= 0){
      clearInterval(timerId);
      txt.textContent = T[lang].btn; pr.style.width = '0';
      $('go').disabled = false; busy = false;
      $('state').textContent = T[lang].ready;
      $('val').innerHTML = '1.00<small>x</small>';
      $('val').classList.remove('gone');
      drawCurve(0);
    }
  };
  tick(); timerId = setInterval(tick, 1000);
}

$('go').onclick = ()=>{ if(!busy){ hap('medium'); run(); } };
$('goTxt').textContent = T[lang].btn;
$('state').textContent = T[lang].ready;
$('hint').textContent  = T[lang].hint;
$('lAvg').textContent = T[lang].avg;
$('lMax').textContent = T[lang].max;
$('lCnt').textContent = T[lang].cnt;
seedHistory(); drawCurve(0);
</script>
</body>
</html>
